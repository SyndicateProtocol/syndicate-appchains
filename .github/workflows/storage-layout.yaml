name: Storage Layout Validation

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'synd-contracts/src/**/*.sol'
      - 'synd-contracts/foundry.toml'
      - 'synd-contracts/remappings.txt'
  push:
    branches: [main]
    paths:
      - 'synd-contracts/src/**/*.sol'
      - 'synd-contracts/foundry.toml'
      - 'synd-contracts/remappings.txt'

env:
  FOUNDRY_PROFILE: default
  FOUNDRY_DISABLE_NIGHTLY_WARNING: true

jobs:
  storage-layout-validation:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: synd-contracts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install Foundry dependencies
        run: forge install

      - name: Validate storage layouts
        run: |
          echo "🔍 Validating storage layouts for upgradeable contracts..."

          # Build contracts
          forge build
          mkdir -p .storage-layouts

          # Extract storage layouts for upgradeable contracts
          echo "📊 Extracting storage layouts..."

          CONTRACTS="SyndicateFactory SyndicateSequencingChain ArbChainConfig GasAggregator"

          for contract in $CONTRACTS; do
            echo "Extracting layout for $contract..."
            if forge inspect $contract storageLayout > .storage-layouts/$contract.json 2>/dev/null; then
              echo "✅ $contract: Storage layout extracted successfully"

              # Basic validation - check if layout is not empty
              if [ -s .storage-layouts/$contract.json ]; then
                echo "✅ $contract: Storage layout is valid (non-empty)"
              else
                echo "❌ $contract: Storage layout is empty!"
                exit 1
              fi
            else
              echo "❌ $contract: Failed to extract storage layout - contract may not exist or not be upgradeable"
              exit 1
            fi
          done

          echo ""
          echo "✅ All upgradeable contracts have valid storage layouts!"
          echo ""
          echo "Storage layout files created:"
          ls -la .storage-layouts/

      - name: Upload storage layouts as artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storage-layouts-${{ github.sha }}
          path: synd-contracts/.storage-layouts/
          retention-days: 30