name: Storage Layout Validation

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'synd-contracts/src/**/*.sol'
      - 'synd-contracts/foundry.toml'
      - 'synd-contracts/remappings.txt'
  push:
    branches: [main]
    paths:
      - 'synd-contracts/src/**/*.sol'
      - 'synd-contracts/foundry.toml'
      - 'synd-contracts/remappings.txt'

env:
  FOUNDRY_PROFILE: default

jobs:
  storage-layout-validation:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: synd-contracts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for comparison
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Node.js dependencies
        run: npm install

      - name: Install Foundry dependencies
        run: forge install

      - name: Check inheritance ordering (informational)
        continue-on-error: true
        run: |
          echo "🔍 Checking inheritance ordering (informational only)..."
          make storage-layout-inheritance || echo "ℹ️ Inheritance conflicts detected - this is informational and does not block the workflow"

      - name: Build and extract current layout
        run: |
          echo "🏗️ Building contracts and extracting current storage layout..."
          echo "DEBUG: Checking Node.js setup..."
          node --version
          npm --version
          echo "DEBUG: Checking if npm dependencies are available..."
          ls -la node_modules/@openzeppelin/ || echo "OpenZeppelin not found"
          echo "DEBUG: About to run make storage-layout-extract"
          if make storage-layout-extract; then
            echo "✅ SUCCESS: Current layout extracted successfully"
            ls -la .storage-layouts/
          else
            echo "❌ FAILED: Current layout extraction failed"
            echo "ERROR: Makefile output above should show the failure reason"
            ls -la .storage-layouts/ || echo "No .storage-layouts directory"
            echo "DEBUG: Checking if forge-extract.js exists and is executable..."
            ls -la scripts/storage-checks/forge-extract.js
            echo "DEBUG: Testing forge-extract.js directly..."
            node scripts/storage-checks/forge-extract.js | head -10 || echo "forge-extract.js failed"
            exit 1
          fi

      - name: Setup baseline for comparison (if not push to main)
        if: github.event_name == 'pull_request'
        run: |
          echo "📋 Setting up baseline layout from main branch..."
          echo "DEBUG: Current branch before checkout: $(git branch --show-current)"

          git fetch origin main:main
          git checkout main
          echo "DEBUG: Switched to branch: $(git branch --show-current)"

          # Build main branch and extract baseline
          echo "DEBUG: Installing forge dependencies on main..."
          forge install

          echo "DEBUG: Creating baseline on main branch..."
          if make storage-layout-baseline; then
            echo "✅ SUCCESS: Baseline created on main branch"
            ls -la .storage-layouts/
          else
            echo "❌ FAILED: Baseline creation failed on main branch"
            ls -la .storage-layouts/ || echo "No .storage-layouts directory"
            exit 1
          fi

          # Switch back to PR branch
          git checkout ${{ github.head_ref }}
          echo "DEBUG: Switched back to branch: $(git branch --show-current)"

          # Rebuild current branch
          echo "DEBUG: Reinstalling dependencies on PR branch..."
          forge install

          echo "DEBUG: Re-extracting current layout..."
          if make storage-layout-extract; then
            echo "✅ SUCCESS: Current layout re-extracted"
            ls -la .storage-layouts/
          else
            echo "❌ FAILED: Current layout re-extraction failed"
            ls -la .storage-layouts/ || echo "No .storage-layouts directory"
            exit 1
          fi

      - name: Compare storage layouts
        if: github.event_name == 'pull_request'
        run: |
          echo "⚖️ Comparing storage layouts between main and current branch..."
          echo "DEBUG: Checking for baseline file..."

          if [ ! -f .storage-layouts/main-layout.json ]; then
            echo "📋 No baseline found on main branch. Creating initial baseline..."
            echo "ℹ️ This PR will establish the storage layout baseline for future comparisons."

            if [ -f .storage-layouts/current-layout.json ]; then
              cp .storage-layouts/current-layout.json .storage-layouts/main-layout.json
              echo "✅ SUCCESS: Baseline established - future PRs will be validated against this."
            else
              echo "❌ FAILED: No current-layout.json to use as baseline!"
              ls -la .storage-layouts/
              exit 1
            fi
          else
            echo "📊 Comparing against existing baseline..."
            echo "DEBUG: Files available for comparison:"
            ls -la .storage-layouts/

            if make storage-layout-compare; then
              echo "✅ SUCCESS: Storage layout comparison passed"
            else
              echo "❌ FAILED: Storage layout comparison failed"
              echo "DEBUG: Showing baseline vs current differences..."
              echo "=== BASELINE ==="
              head -20 .storage-layouts/main-layout.json || echo "Cannot read main-layout.json"
              echo "=== CURRENT ==="
              head -20 .storage-layouts/current-layout.json || echo "Cannot read current-layout.json"
              exit 1
            fi
          fi

      - name: Upload storage layouts as artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storage-layouts-${{ github.sha }}
          path: |
            synd-contracts/.storage-layouts/
          retention-days: 30

      - name: Storage layout validation summary
        if: success()
        run: |
          echo "✅ Storage layout validation completed successfully!"
          echo ""
          echo "📊 Validation checks performed:"
          echo "  - Contract inheritance ordering ✅"
          echo "  - Storage layout extraction ✅"
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "  - Storage layout compatibility ✅"
          fi
          echo ""
          echo "🛡️ Your upgradeable contracts are safe from storage collisions!"

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let message = `## ✅ Storage Layout Validation Passed

            🛡️ **All storage layout checks completed successfully!**

            ### Checks Performed:
            - ✅ Contract inheritance ordering validation
            - ✅ Storage layout extraction and analysis`;

            // Check if this established a new baseline
            if (!fs.existsSync('.storage-layouts/main-layout.json') || fs.readFileSync('.storage-layouts/main-layout.json', 'utf8') === '{}') {
              message += `
            - ✅ **Initial baseline established** for future storage layout comparisons

            ### What this means:
            This PR establishes the **storage layout baseline** for your upgradeable contracts. Future PRs will be validated against this baseline to prevent storage collisions.`;
            } else {
              message += `
            - ✅ Storage layout compatibility between \`main\` and current branch

            ### What this means:
            Your upgradeable contracts (like \`SyndicateFactory\`) are **safe from storage collisions** during upgrades. No existing storage slots will be corrupted or overwritten.`;
            }

            message += `

            📊 Storage layout artifacts have been uploaded and can be reviewed in the workflow run.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            })

      - name: Fail with helpful message
        if: failure()
        run: |
          echo "❌ Storage layout validation failed!"
          echo ""
          echo "🔍 DEBUG: Checking which step failed..."
          echo "Current working directory: $(pwd)"
          echo "Available files:"
          ls -la .storage-layouts/ 2>/dev/null || echo "No .storage-layouts directory found"
          echo ""
          echo "Git status:"
          git status --porcelain || echo "Cannot check git status"
          echo ""
          echo "Last few commands in workflow log should show the exact failure."
          echo ""
          echo "🔍 Common failure reasons:"
          echo "  1. Contract compilation failed (check forge build output above)"
          echo "  2. Storage extraction failed (missing contracts or build artifacts)"
          echo "  3. Forge inspect command failed (contract not found)"
          echo "  4. File system issues (permissions, missing directories)"
          echo "  5. Storage slot conflicts in upgradeable contracts"
          echo ""
          echo "🛠️ To debug:"
          echo "  1. Look for ERROR messages in the logs above"
          echo "  2. Check if contracts compile with 'forge build'"
          echo "  3. Verify contract names in forge-extract.js match actual contracts"
          echo "  4. Run 'make storage-layout-extract' locally to reproduce"
          echo ""
          echo "📖 Learn more: https://docs.openzeppelin.com/upgrades-plugins/1.x/writing-upgradeable"
          exit 1