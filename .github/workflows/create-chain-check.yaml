# This workflow checks that the TypeScript ABI files in create-chain/scripts/abi/synd are up to date.
# It regenerates the ABIs from the smart contracts and compares them to the committed versions.
# This ensures that any changes to smart contracts are reflected in the TypeScript bindings used by create-chain.

name: Create Chain ABI Check

on:
  # Run workflow on every push to main. This ensures that cross-service PRs that
  # depend on synd-contracts are tested.
  push:
    branches:
      - main
      - staging
  # Only run on PRs that touch contracts or create-chain ABIs
  pull_request:
    paths:
      - 'synd-contracts/**'
      - 'create-chain/scripts/abi/synd/**'
      - 'create-chain/Makefile'
      - '.github/workflows/create-chain-check.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci

jobs:
  create-chain-abi-check:
    name: Create Chain ABI Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.5

      - name: Show Forge version
        run: |
          forge --version

      - name: Build contracts
        working-directory: "synd-contracts"
        run: |
          forge build

      - name: Generate ABIs and bytecode
        working-directory: "create-chain"
        run: |
          make generate-contract-abis

      - name: Check if ABIs are up to date
        run: |
          git diff --exit-code create-chain/scripts/abi/synd/ || (
            echo "❌ Error: TypeScript ABI files are out of date."
            echo ""
            echo "The committed ABI files don't match the ones generated from the contracts."
            echo "Please run the following command to regenerate them:"
            echo ""
            echo "  cd create-chain && make generate-contract-abis"
            echo ""
            echo "Then commit the updated files."
            echo ""
            echo "Files that differ:"
            git diff --name-only create-chain/scripts/abi/synd/
            exit 1
          )

      - name: Success message
        if: success()
        run: |
          echo "✅ All TypeScript ABI files are up to date!"

      # Needs to be the last job step
      - name: Notify Slack on Failure
        # Only notify for workflow_run failures on main branch (not PRs)
        if: failure() && github.ref_name == 'main'
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: "danger"
          SLACK_MESSAGE: ":x: `${{github.workflow}}` failed on `main` branch. View failure information here: <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow>"
          SLACK_TITLE: "*${{github.workflow}}* failed on `main` branch. Notify the author of the latest PR merged to `main`"
