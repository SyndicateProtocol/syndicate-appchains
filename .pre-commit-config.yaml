exclude: vendor|\.pb\.go

repos:
  - repo: local
    hooks:
      - id: fmt
        name: fmt
        args: ["--all", "--check", "--", "--unstable-features"] # nightly Rust required for `imports_granularity` feature
        entry: cargo +nightly fmt
        language: system
        types: [rust]
        pass_filenames: false
      - id: clippy
        name: clippy
        args:
          [
            "--workspace",
            "--all-targets",
            "--all-features",
            "--",
            "-D",
            "warnings",
          ]
        entry: cargo clippy
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-machete
        name: cargo machete
        entry: cargo machete
        language: system
        types: [rust]
        pass_filenames: false
        # it's necessary to specify the arguments one by one to avoid issues with git submodules (particularly inside synd-withdrawals)
        args:
          [
            "Cargo.toml",
            "shared",
            "synd-batch-sequencer",
            "synd-maestro",
            "synd-mchain",
            "synd-translator",
            "synd-withdrawals/synd-tee-attestation-zk-proofs/aws-nitro",
            "synd-withdrawals/synd-tee-attestation-zk-proofs/sp1/program",
            "test-framework",
          ]
      - id: forge-fmt
        name: forge fmt
        entry: forge fmt
        args: ["--check"]
        language: system
        types: [solidity]
      - id: forge-test-synd-contracts
        name: forge test syndicate contracts
        entry: env ETH_MAINNET_RPC_URL=https://ethereum-rpc.publicnode.com forge test
        args: ["--root", "synd-contracts"]
        language: system
        types: [solidity]
        files: ^(synd-contracts)/
        pass_filenames: false
      - id: taplo-fmt
        name: Cargo.toml format validation
        entry: taplo fmt
        args: ["--check", "**/Cargo.toml", "--verbose"]
        language: system
        types: [cargo]
        pass_filenames: false
      - id: storage-layout-update
        name: Update storage layout baseline
        entry: synd-contracts/scripts/storage-checks/update-baseline.sh
        language: script
        files: 'synd-contracts/src/.*\.sol$'
        pass_filenames: false
        always_run: false
        stages: [pre-commit]
      - id: synd-cli-biome-check
        name: synd-cli check
        entry: bash -c 'cd synd-cli && npx biome check --write --files-ignore-unknown=true --no-errors-on-unmatched'
        language: system
        types: [text]
        files: "^synd-cli/.*\\.(jsx?|tsx?|c(js|ts)|m(js|ts)|d\\.(ts|cts|mts)|jsonc?|css|svelte|vue|astro|graphql|gql)$"
        pass_filenames: false
