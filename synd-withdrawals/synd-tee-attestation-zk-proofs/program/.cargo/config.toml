# based on https://github.com/succinctlabs/sp1/blob/bb91c6f64f8b0b8acd59558541fce8336e967881/crates/build/src/command/utils.rs#L53
[target.riscv32im-succinct-zkvm-elf]
rustflags="-C passes=lower-atomic -C link-arg=-Ttext=0x00201000 -C link-arg=--image-base=0x00200800 -C panic=abort --cfg getrandom_backend=\"custom\" -C llvm-args=-misched-prera-direction=bottomup -C llvm-args=-misched-postra-direction=bottomup"

# based on https://docs.rs/risc0-build/3.0.3/src/risc0_build/lib.rs.html#455
# use Ttext=0xc0000000 for kernel programs
[target.riscv32im-risc0-zkvm-elf]
rustflags="-C passes=lower-atomic -C link-arg=-Ttext=0x00200800 -C link-arg=--fatal-warnings -C panic=abort --cfg getrandom_backend=\"custom\""