[package]
name = "shared"
version = "0.1.0"
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Backward compatibility crate that re-exports all Syndicate shared functionality"

[dependencies]
alloy = { workspace = true, features = [
  "consensus",
  "contract",
  "json-rpc",
  "k256",
  "provider-ws",
  "providers",
  "pubsub",
  "reqwest",
  "rlp",
  "rpc-types",
  "signer-local",
  "signers",
] }

async-trait                        = { workspace = true }
axum                               = { workspace = true }
byte-unit                          = { workspace = true, features = ["default"] }
bytes                              = { workspace = true }
eyre                               = { workspace = true }
http                               = { workspace = true }
jsonrpsee                          = { workspace = true, features = ["client", "jsonrpsee-types"] }
opentelemetry                      = { workspace = true }
opentelemetry-otlp                 = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }
opentelemetry-stdout               = { workspace = true }
opentelemetry_sdk                  = { workspace = true }
prometheus-client                  = { workspace = true }
redis                              = { workspace = true, features = ["connection-manager", "tokio-comp"] }
rlp                                = { workspace = true }
serde                              = { workspace = true, features = ["derive"] }
serde_json                         = { workspace = true }
thiserror                          = { workspace = true }
tokio                              = { workspace = true }
tracing                            = { workspace = true }
tracing-opentelemetry              = { workspace = true }
tracing-subscriber                 = { workspace = true, features = ["env-filter", "json"] }
url                                = { workspace = true }

[lints]
workspace = true